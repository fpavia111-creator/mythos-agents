# Fictional manifests for demos and tests (kubectl get -o yaml style, trimmed).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api
  namespace: payments
  resourceVersion: "1877"
  uid: 00000000-0000-4000-8000-00000000aaaa
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: api
        image: registry.example.com/billing-api:latest
        env:
        - name: DB_PASSWORD
          value: fake-k8s-pass-2222
        - name: LOG_LEVEL
          value: debug
        securityContext:
          privileged: true
          runAsNonRoot: true
        resources:
          limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: billing-api
  namespace: payments
spec:
  type: LoadBalancer
  ports:
  - name: https
    port: 443
    targetPort: 8443
---
apiVersion: v1
kind: Secret
metadata:
  name: billing-keys
  namespace: payments
type: Opaque
data:
  signing-key: ZmFrZS1zaWduaW5nLWtleS0y
